services:
  - type: web
    name: discord-clone-server
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm install && npm run build -w packages/shared && npm run build -w server
    startCommand: npm run start -w server
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CLIENT_ORIGIN
        sync: false
      - key: PORT
        value: 4000
